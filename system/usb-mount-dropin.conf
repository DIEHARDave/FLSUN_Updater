# Installed by FLSUN_Updater into FLSun's USB mount units (usb-mount@ and
# u-mount@, started by /etc/udev/rules.d/74-um.rules and 75-um.rules). Once
# a stick is mounted, FLSUN_Updater looks on it for flsun_recovery.cfg. This
# also runs at boot, when udev mounts a stick that is already plugged in.
[Service]
ExecStartPost=-/bin/systemctl start --no-block flsun_updater_usb.service
