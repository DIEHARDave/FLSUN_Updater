# FLSUN_Updater's plugin list for the FLSun T1 Pro.
#
# Each section is a Moonraker [update_manager] entry, the same format as
# Zmod's extra_plugins.moonraker.conf. FLSUN_Updater lists every plugin in
# flsun_plugins.cfg; for each one set to yes (or ENABLE_PLUGIN NAME=...), it
# installs it and copies its entry into flsun_updater_plugins.conf, so
# Mainsail and Fluidd keep it up to date.
#
#   type: git_repo   cloned from origin into path. If the repo has an
#                    install.sh, it runs as pi, with sudo; uninstall.sh runs
#                    on removal. An entry the plugin's installer already
#                    adds itself isn't copied a second time.
#   type: web        a release zip (asset_name) from repo, unpacked into
#                    path. FLSun's Moonraker can't handle these by itself;
#                    FLSUN_Updater's Moonraker component does.
#
# Options starting with flsun_ are FLSUN_Updater's own; Moonraker never sees
# them:
#   flsun_title, flsun_description   shown in flsun_plugins.cfg
#   flsun_install, flsun_uninstall   other script names, or none
#   flsun_owner                      web only: pi (default) or root
#   flsun_hook                       a module in hooks/ run at install,
#                                    update, boot and removal
#
# To ask for a plugin to be added, open a plugin request:
# https://github.com/DIEHARDave/FLSUN_Updater/issues/new?template=plugin_request.yml

[update_manager flsun_timelapse]
type: git_repo
channel: dev
path: ~/FLSUN_Timelapse
origin: https://github.com/DIEHARDave/FLSUN_Timelapse.git
primary_branch: main
managed_services: klipper moonraker
flsun_title: FLSUN_Timelapse
flsun_description: Timelapse videos in Mainsail and Fluidd, based on moonraker-timelapse

[update_manager flsun_remote_screen]
type: git_repo
channel: dev
path: ~/FLSUN_RemoteScreen
origin: https://github.com/DIEHARDave/FLSUN_RemoteScreen.git
primary_branch: main
managed_services: flsun_remote_screen
flsun_title: FLSUN_RemoteScreen
flsun_description: View and control the touchscreen from a browser at http://<printer-ip>/screen/

[update_manager flsun_notify]
type: git_repo
channel: dev
path: ~/FLSUN_notify
origin: https://github.com/DIEHARDave/FLSUN_notify.git
primary_branch: main
managed_services: klipper moonraker
flsun_title: FLSUN_notify
flsun_description: Print notifications with a camera photo to Telegram, Discord, Matrix and more, based on Zmod's notify plugin

[update_manager fluidd]
type: web
channel: stable
repo: fluidd-core/fluidd
path: ~/fluidd
asset_name: fluidd.zip
flsun_title: Fluidd
flsun_description: The Fluidd web interface at http://<printer-ip>:81, beside Mainsail
# Writes Fluidd's nginx site on port 81.
flsun_hook: fluidd

# HelixScreen: hidden until HelixScreen's main branch supports the T1 Pro
