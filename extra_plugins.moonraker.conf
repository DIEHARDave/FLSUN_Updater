# FLSUN_Updater's plugin list for the FLSun T1 Pro.
#
# Each section is a Moonraker [update_manager] entry, the same format as
# Zmod's extra_plugins.moonraker.conf. FLSUN_Updater lists every plugin in
# flsun_plugins.cfg; for each one set to yes (or ENABLE_PLUGIN NAME=...), it
# installs it and copies its entry into flsun_updater_plugins.conf, so
# Mainsail and Fluidd keep it up to date.
#
#   type: git_repo   cloned from origin into path. If the repo has an
#                    install.sh, it runs as pi, with sudo; uninstall.sh runs
#                    on removal. An entry the plugin's installer already
#                    adds itself isn't copied a second time.
#   type: web        a release zip (asset_name) from repo, unpacked into
#                    path. FLSun's Moonraker can't handle these by itself;
#                    FLSUN_Updater's Moonraker component does.
#
# Options starting with flsun_ are FLSUN_Updater's own; Moonraker never sees
# them:
#   flsun_title, flsun_description   shown in flsun_plugins.cfg
#   flsun_install, flsun_uninstall   other script names, or none
#   flsun_owner                      web only: pi (default) or root
#   flsun_hook                       a module in hooks/ run at install,
#                                    update, boot and removal
#
# To ask for a plugin to be added, open a plugin request:
# https://github.com/DIEHARDave/FLSUN_Updater/issues/new?template=plugin_request.yml

[update_manager flsun_timelapse]
type: git_repo
channel: stable
path: ~/FLSUN_Timelapse
origin: https://github.com/DIEHARDave/FLSUN_Timelapse.git
primary_branch: main
managed_services: klipper moonraker
flsun_title: FLSUN_Timelapse
flsun_description: Timelapse videos in Mainsail and Fluidd, based on moonraker-timelapse

[update_manager flsun_remote_screen]
type: git_repo
channel: stable
path: ~/FLSUN_RemoteScreen
origin: https://github.com/DIEHARDave/FLSUN_RemoteScreen.git
primary_branch: main
managed_services: flsun_remote_screen
flsun_title: FLSUN_RemoteScreen
flsun_description: View and control the touchscreen from a browser at http://<printer-ip>/screen/

# Archived 2026-11-17, replaced by flsun_pushraker. Still listed so that
# setting it to no removes it; flsun_retired hides it where it isn't installed.
[update_manager flsun_notify]
type: git_repo
channel: dev
path: ~/FLSUN_notify
origin: https://github.com/DIEHARDave/FLSUN_notify.git
primary_branch: main
managed_services: klipper moonraker
flsun_title: FLSUN_notify (retired)
flsun_retired: yes
flsun_description: Retired and archived: use flsun_pushraker instead. Kept so it can still be turned off here; it keeps working where it's installed

[update_manager flsun_macros]
type: git_repo
channel: stable
path: ~/FLSUN_Macros
origin: https://github.com/DIEHARDave/FLSUN_Macros.git
primary_branch: main
managed_services: klipper
flsun_title: FLSUN_Macros
flsun_description: Klipper macros: PRINT_START/PRINT_END with a bed mesh per bed temperature, pause at layer, filament, PID and light (needed by the Orca profile)

[update_manager flsun_theme]
type: git_repo
channel: stable
path: ~/FLSUN_theme
origin: https://github.com/DIEHARDave/FLSUN_theme.git
primary_branch: main
is_system_service: False
flsun_title: FLSUN_theme
flsun_description: FLSun's theme (logo and backgrounds) for Mainsail, and as the FLSUN theme in Fluidd; your previous theme is backed up and restored when disabled

# Listed before flsun_klipper, which needs its Python and compiler; plugins
# turned on together are installed in this order.
[update_manager flsun_moonraker]
type: git_repo
channel: stable
path: ~/FLSUN_moonraker
origin: https://github.com/DIEHARDave/FLSUN_moonraker.git
primary_branch: main
is_system_service: False
flsun_title: FLSUN_moonraker
flsun_description: Current upstream Moonraker in place of FLSun's 2023 one (installs Python 3.13; about 10 minutes)

[update_manager flsun_klipper]
type: git_repo
channel: stable
path: ~/FLSUN_klipper
origin: https://github.com/DIEHARDave/FLSUN_klipper.git
primary_branch: main
managed_services: klipper
flsun_title: FLSUN_klipper
flsun_description: Upstream Klipper in place of FLSun's 2022 fork, beside it and without flashing the mainboard (needs FLSUN_moonraker)

# Archived 2026-11-18, replaced by diehard-pushraker. Still listed (before
# it, so switching both in one run removes this one first) so that setting
# it to no removes it; flsun_retired hides it where it isn't installed.
[update_manager flsun_pushraker]
type: git_repo
channel: dev
path: ~/FLSUN_pushraker
origin: https://github.com/DIEHARDave/FLSUN_pushraker.git
primary_branch: main
managed_services: flsun_pushraker
flsun_title: FLSUN_pushraker (retired)
flsun_retired: yes
flsun_description: Retired and archived: use diehard-pushraker instead. Kept so it can still be turned off here; it keeps working where it's installed

# After flsun_moonraker: pushraker needs its Python 3.13. Its installer adds
# this entry to ~/printer_data/config/diehard-pushraker.conf itself.
[update_manager diehard-pushraker]
type: git_repo
channel: stable
path: ~/diehard-pushraker
origin: https://github.com/DIEHARDave/diehard-pushraker.git
primary_branch: main
managed_services: diehard-pushraker
flsun_install: platform/flsun/install.sh
flsun_uninstall: platform/flsun/uninstall.sh
flsun_title: diehard-pushraker
flsun_description: pushraker push notifications with camera snapshots to ntfy, Pushover, Telegram, Discord, email and more, with Discord status cards and daily update notices, set up at http://<printer-ip>/notifications/ (needs FLSUN_moonraker)

[update_manager flsun_nfc]
type: git_repo
channel: stable
path: ~/FLSUN_NFC
origin: https://github.com/DIEHARDave/FLSUN_NFC.git
primary_branch: main
managed_services: klipper
flsun_title: FLSUN_NFC
flsun_description: NFC/RFID filament tags: scan a spool and it becomes the active Spoolman spool, with its material and color for OrcaSlicer and HelixScreen (USB readers: PN532, ACR122U, ...)

[update_manager flsun_afc]
type: git_repo
channel: stable
path: ~/FLSUN_AFC
origin: https://github.com/DIEHARDave/FLSUN_AFC.git
primary_branch: main
managed_services: klipper
flsun_title: FLSUN_AFC
flsun_description: EXPERIMENTAL: the full AFC-Klipper-Add-On for filament changers (BoxTurtle, NightOwl, HTLF, QuattroBox, ViViD, EMU, ...); pick the unit in flsun_afc_unit.conf (needs FLSUN_klipper)

[update_manager fluidd]
type: web
channel: stable
repo: fluidd-core/fluidd
path: ~/fluidd
asset_name: fluidd.zip
flsun_title: Fluidd
flsun_description: The Fluidd web interface at http://<printer-ip>:81, beside Mainsail
# Writes Fluidd's nginx site on port 81.
flsun_hook: fluidd

[update_manager helixscreen]
type: web
# HelixScreen has no stable release with the T1 Pro's detection yet.
channel: beta
# HelixScreen's releases have no T1 package, and won't: the T1 runs the
# Centauri Carbon (cc1) one, a static armv7 build for the same 480x272
# panel. The hook gives it the T1's settings (hooks/helixscreen.py).
repo: prestonbrown/helixscreen
path: ~/helixscreen
asset_name: helixscreen-cc1.zip
persistent_files:
    config/settings.json
    config/helixscreen.env
flsun_title: HelixScreen
flsun_description: Touchscreen UI in place of FLSun's stock screen
# The launcher only reads config/helixscreen.env from a root-owned install.
flsun_owner: root
flsun_hook: helixscreen
