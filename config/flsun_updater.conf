# FLSUN_Updater - Moonraker settings
# install.sh copies this file to ~/printer_data/config/flsun_updater.conf
# once and never overwrites it.

[update_manager flsun_updater]
type: git_repo
primary_branch: main
path: ~/FLSUN_Updater
origin: https://github.com/DIEHARDave/FLSUN_Updater.git
# Restarting the service after an update adds newly listed plugins to
# flsun_plugins.cfg.
managed_services: flsun_updater
