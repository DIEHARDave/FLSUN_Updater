# FLSUN_Updater plugin macros. FLSUN_Updater links this file into the config
# folder and includes it from printer.cfg; don't edit the linked copy.
#
#   PLUGINS                         the plugin window: install, remove, and
#                                   turn updates on or off, then Save
#   LIST_PLUGINS                    show the plugins and which are enabled
#   ENABLE_PLUGIN NAME=helixscreen  install a plugin
#   DISABLE_PLUGIN NAME=helixscreen remove a plugin
#   UPDATE_ALL                      install every update except the OS
#                                   packages (like Update all in Mainsail)
#   UPDATE_ALL CHECK=1              only list the available updates
#
# They set the plugin to yes or no in flsun_plugins.cfg, which installs or
# removes it, after any running print. Progress is in logs/flsun_updater.log.

[gcode_macro LIST_PLUGINS]
description: List FLSUN_Updater plugins and which are enabled
gcode:
    {action_call_remote_method("flsun_plugin_list")}

[gcode_macro ENABLE_PLUGIN]
description: Install a FLSUN_Updater plugin: ENABLE_PLUGIN NAME=<plugin>
gcode:
    {% if not params.NAME %}
        {action_raise_error("Usage: ENABLE_PLUGIN NAME=<plugin>. LIST_PLUGINS shows the plugins.")}
    {% endif %}
    {action_call_remote_method("flsun_plugin_set", name=params.NAME, enabled=True)}

[gcode_macro DISABLE_PLUGIN]
description: Remove a FLSUN_Updater plugin: DISABLE_PLUGIN NAME=<plugin>
gcode:
    {% if not params.NAME %}
        {action_raise_error("Usage: DISABLE_PLUGIN NAME=<plugin>. LIST_PLUGINS shows the plugins.")}
    {% endif %}
    {action_call_remote_method("flsun_plugin_set", name=params.NAME, enabled=False)}

[gcode_macro UPDATE_ALL]
description: Install every update except the OS packages. CHECK=1 only lists them
gcode:
    {% if printer.print_stats.state in ["printing", "paused"] %}
        {action_raise_error("UPDATE_ALL: not while a print is running")}
    {% endif %}
    {action_call_remote_method("flsun_update_all", check=params.CHECK|default(0)|int)}

[gcode_macro PLUGINS]
description: Plugin window: install or remove FLSUN_Updater plugins, turn their updates on or off
gcode:
    {action_call_remote_method("flsun_plugin_menu")}

# The window's buttons
[gcode_macro _FLSUN_PLUGIN_MENU_TOGGLE]
gcode:
    {action_call_remote_method("flsun_plugin_menu_toggle", name=params.NAME|default(""))}

[gcode_macro _FLSUN_PLUGIN_MENU_UPDATES]
gcode:
    {action_call_remote_method("flsun_plugin_menu_updates", name=params.NAME|default(""))}

[gcode_macro _FLSUN_PLUGIN_MENU_SAVE]
gcode:
    {action_call_remote_method("flsun_plugin_menu_save")}

[gcode_macro _FLSUN_PLUGIN_MENU_CLOSE]
gcode:
    {action_call_remote_method("flsun_plugin_menu_close")}
