# FLSUN_Updater plugin macros. FLSUN_Updater links this file into the config
# folder and includes it from printer.cfg; don't edit the linked copy.
#
#   LIST_PLUGINS                    show the plugins and which are enabled
#   ENABLE_PLUGIN NAME=helixscreen  install a plugin
#   DISABLE_PLUGIN NAME=helixscreen remove a plugin
#
# They set the plugin to yes or no in flsun_plugins.cfg, which installs or
# removes it, after any running print. Progress is in logs/flsun_updater.log.

[gcode_macro LIST_PLUGINS]
description: List FLSUN_Updater plugins and which are enabled
gcode:
    {action_call_remote_method("flsun_plugin_list")}

[gcode_macro ENABLE_PLUGIN]
description: Install a FLSUN_Updater plugin: ENABLE_PLUGIN NAME=<plugin>
gcode:
    {% if not params.NAME %}
        {action_raise_error("Usage: ENABLE_PLUGIN NAME=<plugin>. LIST_PLUGINS shows the plugins.")}
    {% endif %}
    {action_call_remote_method("flsun_plugin_set", name=params.NAME, enabled=True)}

[gcode_macro DISABLE_PLUGIN]
description: Remove a FLSUN_Updater plugin: DISABLE_PLUGIN NAME=<plugin>
gcode:
    {% if not params.NAME %}
        {action_raise_error("Usage: DISABLE_PLUGIN NAME=<plugin>. LIST_PLUGINS shows the plugins.")}
    {% endif %}
    {action_call_remote_method("flsun_plugin_set", name=params.NAME, enabled=False)}
