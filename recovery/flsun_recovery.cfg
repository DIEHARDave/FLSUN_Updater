# FLSUN_Updater recovery file. It turns plugins off without a network,
# for example when a plugin left the printer with no Wi-Fi.
#
# 1. Copy this file to the top folder of a USB stick (FAT32), keeping
#    its name: flsun_recovery.cfg
# 2. Set the plugins to turn off to no, below. Plugin names are the ones
#    in flsun_plugins.cfg. all: no turns off every plugin.
# 3. Plug the stick into the printer, then turn the printer on (or plug it
#    in while the printer is on).
#
# The printer removes the plugins, after any running print. When it's done,
# this file is renamed flsun_recovery.done.cfg, so it isn't applied again,
# and flsun_recovery.log on the stick shows what happened. Removing
# HelixScreen brings FLSun's stock screen back.
#
# A recovery file only turns plugins off. Turn them back on as usual, with
# ENABLE_PLUGIN NAME=<plugin> or in flsun_plugins.cfg.

[plugins]
helixscreen: no

# To put back a Klipper backup, for example the stock Klipper after an
# upgrade went wrong, copy the backup into a folder named flsun_restore on
# the stick (klipper_stock.tar.gz and klipper_stock.tar.gz.sha256), then
# remove the # in front of the two lines below. The printer waits for any
# print to finish, checks the backup, moves the current files aside (they
# are renamed *.pre_restore-<date>, not deleted), restores the backup and
# restarts Klipper. A stick that only restores needs no [plugins] section.
#
#[restore]
#klipper: klipper_stock
